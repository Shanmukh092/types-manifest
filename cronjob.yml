kind: CronJob
apiVersion: batch/v1
metadata:
  name: minute-backup
  namespace: nginx-project

spec:
  schedule: "*/2 * * * *" 
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: busybox
            command:
            - /bin/sh
            - -c
            - echo "Database backup completed"
          restartPolicy: Never
